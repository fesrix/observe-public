# HTTP bootstrap. Replace school.example.com before enabling.
# Certbot adds TLS only after this HTTP host is reachable through public DNS.
server {
    listen 80;
    listen [::]:80;
    server_name school.example.com;
    access_log /var/log/nginx/lingua.access.log;
    error_log /var/log/nginx/lingua.error.log warn;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }
    location ~ /(?:\.env|\.git|prisma|deploy)(?:/|$) { return 404; }
}
